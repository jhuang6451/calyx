# Calyx default SSH server configuration
# Only allow public key authentication; disable password authentication
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey

# Allow root login via public key only
PermitRootLogin prohibit-password

# Authorized keys paths (support user home directory and /etc/ssh/authorized_keys.d/%u)
AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2 /etc/ssh/authorized_keys.d/%u /etc/ssh/authorized_keys.d/root
