name: Build and Push Calyx Bootc Image

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  # schedule:
  #   # 暂时关闭定时构建，待本地测试通过后再启用
  #   - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora Major Version'
        required: true
        default: '44'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/calyx
  DEFAULT_FEDORA_VERSION: '44'

jobs:
  build:
    name: Build & Push Image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # 用于 Cosign OIDC 免密签名

    strategy:
      fail-fast: false
      matrix:
        include:
          # - variant: main
          #   nvidia_enabled: 'false'
          #   tag_suffix: ''
          - variant: nvidia
            nvidia_enabled: 'true'
            tag_suffix: '-nvidia'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        run: |
          FEDORA_VER="${{ github.event.inputs.fedora_version || env.DEFAULT_FEDORA_VERSION }}"
          echo "fedora_version=$FEDORA_VER" >> $GITHUB_OUTPUT

      - name: Set up Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          FEDORA_VER="${{ steps.vars.outputs.fedora_version }}"
          SUFFIX="${{ matrix.tag_suffix }}"
          
          TAGS=()
          TAGS+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest${SUFFIX}")
          TAGS+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${FEDORA_VER}${SUFFIX}")
          
          echo "tags=${TAGS[*]}" >> $GITHUB_OUTPUT

      - name: Build Image with Podman
        id: build-image
        run: |
          TAG_FLAGS=()
          for tag in ${{ steps.tags.outputs.tags }}; do
            TAG_FLAGS+=("-t" "$tag")
          done
          
          BASE_IMG="quay.io/fedora-ostree-desktops/kinoite:${{ steps.vars.outputs.fedora_version }}"
          echo "Pre-pulling base image ${BASE_IMG} with retry loop..."
          for i in {1..5}; do
            echo "Attempt $i to pull ${BASE_IMG}..."
            if podman pull "${BASE_IMG}"; then
              echo "Successfully pulled ${BASE_IMG}."
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "ERROR: Failed to pull base image after 5 attempts."
              exit 1
            fi
            echo "Pull failed, retrying in 5 seconds..."
            sleep 5
          done
          
          echo "Building image using Podman..."
          podman build \
            --build-arg FEDORA_MAJOR_VERSION=${{ steps.vars.outputs.fedora_version }} \
            --build-arg NVIDIA_ENABLED=${{ matrix.nvidia_enabled }} \
            --secret id=GITHUB_TOKEN,env=GITHUB_TOKEN \
            "${TAG_FLAGS[@]}" \
            -f ./Containerfile .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        id: push-to-ghcr
        run: |
          TAGS=(${{ steps.tags.outputs.tags }})
          PRIMARY_TAG="${TAGS[0]}"
          
          echo "Pushing primary tag $PRIMARY_TAG with zstd:chunked compression..."
          for i in {1..5}; do
            echo "Attempt $i to push $PRIMARY_TAG..."
            if podman push --compression-format=zstd:chunked "$PRIMARY_TAG"; then
              echo "Successfully pushed $PRIMARY_TAG."
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "ERROR: Failed to push $PRIMARY_TAG after 5 attempts."
              exit 1
            fi
            echo "Push failed, retrying in 5 seconds..."
            sleep 5
          done

          # 对其余标签使用 skopeo copy 进行秒级服务端打标（无需重复压缩与重新上传任何数据块）
          for tag in "${TAGS[@]:1}"; do
            echo "Fast-tagging $tag from $PRIMARY_TAG via skopeo (server-side copy)..."
            skopeo copy \
              --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              "docker://${PRIMARY_TAG}" \
              "docker://${tag}"
            echo "Successfully tagged $tag."
          done

      - name: Sign image with Cosign
        if: github.event_name != 'pull_request'
        run: |
          TAGS=(${{ steps.tags.outputs.tags }})
          PRIMARY_TAG="${TAGS[0]}"
          DIGEST=$(skopeo inspect "docker://$PRIMARY_TAG" --format '{{.Digest}}')
          echo "Found digest: $DIGEST"
          for tag in "${TAGS[@]}"; do
            echo "Signing $tag..."
            cosign sign --yes "$tag@$DIGEST"
          done
