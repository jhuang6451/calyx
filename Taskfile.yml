version: '3'

vars:
  FEDORA_VERSION: '44'
  DEFAULT_REGISTRY:
    sh: |
      if [ -e ~/.config/containers/systemd/registry/registry.container ] || podman ps --format '{{.Names}}' 2>/dev/null | grep -q '^registry$'; then
        echo "127.0.0.1:5000"
      else
        echo "192.168.31.4:5000"
      fi
  REGISTRY: '{{.REGISTRY | default .DEFAULT_REGISTRY}}'
  PUBLIC_REGISTRY: 'registry.elix1r.top'
  IMAGE_NAME: 'calyx'
  NVIDIA: 'false'

tasks:
  default:
    cmds:
      - task: list

  list:
    desc: "列出所有可用任务"
    cmds:
      - task --list

  pull:
    desc: "从 GitHub 远程仓库拉取最新代码并保持工作区纯净"
    cmds:
      - 'echo "==> 正在从远程仓库同步最新代码 (origin/master) ..."'
      - git fetch origin master
      - git checkout master
      - git merge --ff-only origin/master || git reset --hard origin/master
      - 'echo "==> 代码已同步至最新提交: $(git rev-parse --short HEAD)"'

  pull-base:
    desc: "从上游远程镜像仓库拉取最新基础镜像"
    cmds:
      - 'echo "==> 正在从上游镜像仓库拉取基础镜像: quay.io/fedora-ostree-desktops/kinoite:{{.FEDORA_VERSION}} ..."'
      - podman pull quay.io/fedora-ostree-desktops/kinoite:{{.FEDORA_VERSION}}

  ensure-kmods:
    desc: "动态识别基础镜像内核版本，并在需要时编译并推送驱动中间镜像至私有仓"
    cmds:
      - ./scripts/ensure-kmods.sh {{.FEDORA_VERSION}} kinoite quay.io/fedora-ostree-desktops {{.REGISTRY}}

  build:
    desc: "构建 bootc 镜像 (用法: task build NVIDIA=true)"
    deps: [chmod, ensure-kmods]
    vars:
      KERNEL_VERSION:
        sh: cat .kernel-lock 2>/dev/null || echo "unknown"
      KERNEL_SHORT: '{{index (splitList "-" .KERNEL_VERSION) 0}}'
      NVIDIA_SUFFIX: '{{if eq .NVIDIA "true"}}-nvidia{{else}}{{end}}'
      FULL_TAG: '{{.FEDORA_VERSION}}-{{.KERNEL_SHORT}}{{.NVIDIA_SUFFIX}}'
    cmds:
      - 'echo "开始构建 {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.FULL_TAG}} (内核锁定: {{.KERNEL_VERSION}}) ..."'
      - >
        podman build
        --build-arg FEDORA_MAJOR_VERSION={{.FEDORA_VERSION}}
        --build-arg KERNEL_VERSION={{.KERNEL_VERSION}}
        --build-arg NVIDIA_ENABLED={{.NVIDIA}}
        --build-arg REGISTRY={{.REGISTRY}}
        -t {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.FULL_TAG}}
        -t {{.REGISTRY}}/{{.IMAGE_NAME}}:latest{{.NVIDIA_SUFFIX}}
        -t {{.PUBLIC_REGISTRY}}/{{.IMAGE_NAME}}:{{.FULL_TAG}}
        -t {{.PUBLIC_REGISTRY}}/{{.IMAGE_NAME}}:latest{{.NVIDIA_SUFFIX}}
        -f Containerfile .
      - 'echo "构建完成！系统镜像: {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.FULL_TAG}}"'

  build-nvidia:
    desc: "快捷构建 NVIDIA 版本"
    cmds:
      - task: build
        vars:
          NVIDIA: 'true'

  build-and-push:
    desc: "一键构建并推送系统镜像至私有仓 (用法: task build-and-push NVIDIA=true)"
    cmds:
      - task: build
        vars:
          NVIDIA: '{{.NVIDIA}}'
      - task: push
        vars:
          NVIDIA: '{{.NVIDIA}}'

  build-and-push-nvidia:
    desc: "快捷一键构建并推送 NVIDIA 系统镜像"
    cmds:
      - task: build-and-push
        vars:
          NVIDIA: 'true'

  auto-build:
    desc: "全自动构建流水线 (含 git pull、构建驱动、构建镜像、推送与清理)"
    cmds:
      - ./scripts/auto-build.sh

  push:
    desc: "推送系统镜像至本地私有仓并执行版本淘汰 (用法: task push NVIDIA=true)"
    vars:
      KERNEL_VERSION:
        sh: cat .kernel-lock 2>/dev/null || echo "unknown"
      KERNEL_SHORT: '{{index (splitList "-" .KERNEL_VERSION) 0}}'
      NVIDIA_SUFFIX: '{{if eq .NVIDIA "true"}}-nvidia{{else}}{{end}}'
      FULL_TAG: '{{.FEDORA_VERSION}}-{{.KERNEL_SHORT}}{{.NVIDIA_SUFFIX}}'
    cmds:
      - 'echo "推送到私有仓库: {{.REGISTRY}}/{{.IMAGE_NAME}} ..."'
      - podman push --tls-verify=false {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.FULL_TAG}}
      - podman push --tls-verify=false {{.REGISTRY}}/{{.IMAGE_NAME}}:latest{{.NVIDIA_SUFFIX}}
      - 'echo "执行镜像版本生命周期淘汰 (calyx 保留 <= 3 版本)..."'
      - REGISTRY="{{.REGISTRY}}" ./scripts/manage-registry-retention.sh

  push-nvidia:
    desc: "快捷推送 NVIDIA 版本至本地私有仓"
    cmds:
      - task: push
        vars:
          NVIDIA: 'true'

  run:
    desc: "启动容器进行基础检查"
    vars:
      KERNEL_VERSION:
        sh: cat .kernel-lock 2>/dev/null || echo "unknown"
      KERNEL_SHORT: '{{index (splitList "-" .KERNEL_VERSION) 0}}'
      NVIDIA_SUFFIX: '{{if eq .NVIDIA "true"}}-nvidia{{else}}{{end}}'
      FULL_TAG: '{{.FEDORA_VERSION}}-{{.KERNEL_SHORT}}{{.NVIDIA_SUFFIX}}'
    cmds:
      - echo "提示：由于是 bootc 镜像，直接 run 仅能检查文件系统，无法完全模拟真实启动。"
      - podman run -it --rm {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.FULL_TAG}} /bin/bash

  prune:
    desc: "根据保留规则清理私有仓库与本地旧镜像 (kmods<=2, calyx<=3)"
    cmds:
      - REGISTRY="{{.REGISTRY}}" ./scripts/manage-registry-retention.sh

  clean-repo:
    desc: "清理 Git 工作区残留的内核模块与二进制编译产物"
    cmds:
      - rm -rf source/configs/base/usr/lib/modules/*
      - rm -f source/configs/base/usr/bin/ntfs*
      - rm -f source/configs/base/usr/sbin/ntfs*
      - rm -f source/configs/base/usr/sbin/fsck.ntfs source/configs/base/usr/sbin/mkfs.ntfs source/configs/base/usr/sbin/mkntfs
      - rm -f source/configs/base/usr/lib64/libntfs*
      - echo "工作区二进制产物已清理干净！"

  chmod:
    desc: "为所有脚本设置执行权限"
    cmds:
      - chmod +x scripts/*.sh 2>/dev/null || true
      - chmod +x scripts/base/*.sh 2>/dev/null || true
      - chmod +x utils/* 2>/dev/null || true
    silent: true
